<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Illustrated avatar of Naor Zamir">
<defs><clipPath id="c"><rect width="120" height="120" rx="60"/></clipPath><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7d08a"/><stop offset="1" stop-color="#e98a6a"/></linearGradient></defs>
<g clip-path="url(#c)">
<rect width="120" height="120" fill="url(#sun)"/>
<circle cx="88" cy="40" r="14" fill="#fbe7b5"/>
<path d="M0,74 L18,56 L32,66 L50,46 L70,64 L88,50 L120,70 L120,120 L0,120 Z" fill="#8a5a78"/>
<path d="M0,88 L22,74 L44,84 L66,70 L90,82 L120,74 L120,120 L0,120 Z" fill="#5b3b5c"/>
    <!-- body: dark jacket -->
    <path d="M14,122 C16,100 32,90 51,87 L69,87 C88,90 104,100 106,122 Z" fill="#1c2130"/>
    <path d="M51,87 L60,99 L69,87 Z" fill="#2b3142"/>
    <path d="M60,99 L60,122" stroke="#2b3142" stroke-width="1.4"/>
    <!-- backpack strap -->
    <path d="M77,89 C83,98 86,108 86,122" stroke="#b98a5c" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M42,90 C37,98 35,108 35,122" stroke="#11141c" stroke-width="3.2" fill="none" stroke-linecap="round"/>

    <!-- neck -->
    <path d="M52,74 L68,74 L68,88 Q60,92 52,88 Z" fill="#c98e6c"/>

    <!-- ears -->
    <ellipse cx="38.5" cy="55" rx="3.6" ry="5.5" fill="#d9a07c"/>
    <ellipse cx="81.5" cy="55" rx="3.6" ry="5.5" fill="#d9a07c"/>
    <!-- face -->
    <ellipse cx="60" cy="53" rx="21.5" ry="25" fill="#e2ab86"/>

    <!-- beard (short, follows the jaw) -->
    <path d="M39.5,58 C40.5,73 49.5,80.5 60,80.5 C70.5,80.5 79.5,73 80.5,58 C78.5,65 75,69 70.5,70.5 C66.5,67.5 53.5,67.5 49.5,70.5 C45,69 41.5,65 39.5,58 Z" fill="#2f231d" opacity="0.92"/>
    <!-- mustache -->
    <path d="M50,65.5 C54,62.5 66,62.5 70,65.5 C66,64.6 54,64.6 50,65.5 Z" fill="#2a1f1a"/>
    <!-- smile -->
    <path d="M51.5,67 Q60,76.5 68.5,67 Q60,69.6 51.5,67 Z" fill="#ffffff" stroke="#3a2620" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- hair: short, messy, dark -->
    <path d="M37.5,53 C34,33 45,20.5 60,20.5 C77,20.5 87,32 82.5,53 C81,45 79,41 75.5,38.5 C70,41 63,37.5 57,39.5 C51,41.5 45.5,39 42,43 C39.8,45.5 38.6,49 37.5,53 Z" fill="#1d1613"/>
    <path d="M40.5,38 L41.5,29 L45.5,30 L46,22.5 L50.5,26 L52.5,18.5 L56.5,24 L60,17 L63,23 L67.5,18.5 L69,24.5 L74,21.5 L74.5,27.5 L79.5,27 L81,37 Z" fill="#1d1613"/>
    <path d="M52,27 L54.5,21.5 M60.5,25 L62,20 M67.5,27 L70,22.5" stroke="#3d2f28" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    

    <!-- brows -->
    <path d="M44.5,46 Q50.5,42.5 56,45.5" stroke="#1d1613" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M64,45.5 Q69.5,42.5 75.5,46" stroke="#1d1613" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- eyes, slightly squinted from smiling -->
    <ellipse cx="50.5" cy="52.5" rx="3.3" ry="3.8" fill="#1b1411"/>
    <ellipse cx="69.5" cy="52.5" rx="3.3" ry="3.8" fill="#1b1411"/>
    <circle cx="51.6" cy="51.2" r="1.2" fill="#ffffff"/>
    <circle cx="70.6" cy="51.2" r="1.2" fill="#ffffff"/>
    <path d="M46.5,56.5 Q50.5,58.5 54.5,56.5" stroke="#c4876a" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M65.5,56.5 Q69.5,58.5 73.5,56.5" stroke="#c4876a" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M60.5,55 Q58,60.5 61.5,61.5" stroke="#b9765a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="45.5" cy="61" rx="3.4" ry="2" fill="#e88f7a" opacity="0.35"/>
    <ellipse cx="74.5" cy="61" rx="3.4" ry="2" fill="#e88f7a" opacity="0.35"/>
</g>
</svg>
